<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>이메일 인증 안내 · 모아</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">

  <style>
    * { box-sizing: border-box; }

    h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 600; line-height: 1.6; letter-spacing: -.6px; text-align: center; word-break: keep-all; }

  <main><h1 id="message" role="status">로그인 화면에서 인증을 완료해주세요.</h1></main>
  <script type="module" src="email-confirmed.js"></script>
